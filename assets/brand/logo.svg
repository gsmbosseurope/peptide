<svg
  viewBox="0 0 600 700"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="logoTitle"
>
  <title id="logoTitle">TRUSTED Peptide.com</title>

  <defs>
    <linearGradient id="dnaGradient"
      x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082B66"/>
      <stop offset="45%" stop-color="#006DCE"/>
      <stop offset="75%" stop-color="#08C9D9"/>
      <stop offset="100%" stop-color="#087F91"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="textGradient"
      x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#DCEBFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <g filter="url(#glow)" stroke-linecap="round">
    <path
      d="M125 75
         H475
         L420 130
         H180
         Z"
      fill="url(#dnaGradient)"
    />

    <path
      d="M280 130
         C175 190 175 265 285 325
         C395 385 395 460 285 520
         C250 540 235 565 235 600"
      fill="none"
      stroke="url(#dnaGradient)"
      stroke-width="48"
    />

    <path
      d="M320 130
         C425 190 425 265 315 325
         C205 385 205 460 315 520
         C350 540 365 565 365 600"
      fill="none"
      stroke="url(#dnaGradient)"
      stroke-width="48"
    />

    <g stroke="#19D7E5" stroke-width="15">
      <line x1="260" y1="205" x2="340" y2="205"/>
      <line x1="235" y1="250" x2="365" y2="250"/>
      <line x1="250" y1="295" x2="350" y2="295"/>

      <line x1="250" y1="410" x2="350" y2="410"/>
      <line x1="235" y1="455" x2="365" y2="455"/>
      <line x1="260" y1="500" x2="340" y2="500"/>
    </g>
  </g>

  <text
    x="300"
    y="625"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="61"
    font-weight="800"
    letter-spacing="2"
    fill="url(#textGradient)"
  >
    TRUSTED
  </text>

  <text
    x="300"
    y="675"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="35"
    font-weight="400"
    letter-spacing="0"
    fill="#F5F9FF"
  >
    Peptide<tspan fill="#16C9D8">.com</tspan>
  </text>
</svg>
